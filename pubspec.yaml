name: music_widget_flutter
description: "A new Flutter project."


publish_to: 'none' 














version: 1.2.0+1

environment:
  sdk: ^3.12.2







dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  tray_manager: ^0.2.3
  shared_preferences: ^2.3.2
  file_picker: ^11.0.2
  crypto: ^3.0.7
  xml: ^7.0.1
  ffi: ^2.2.0
  material_color_utilities: 0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  
  
  
  
  flutter_lints: ^6.0.0

  
  msix: ^3.16.2





flutter:

  
  
  
  uses-material-design: true

  shaders:
    - shaders/coverLayers.frag
    - shaders/coverSubject.frag
    - shaders/lyricsSmoke.frag

  assets:
    - images/tray_icon.ico
    - images/tray_icon.png
    - assets/brand/qq_music.png
    - assets/brand/netease_cloud.png
    - assets/brand/lrclib.png
    - assets/brand/lawnicons/
    - assets/fonts/MiSans-NOTICE.txt

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSansVF.ttf

  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
msix_config:
  display_name: MD3MusicWidget
  publisher_display_name: syj
  identity_name: com.fuckyou.md3musicwidget
  logo_path: assets/logo.png 
